{% extends "base.html" %}

{% block site_meta %}
<!-- Preconnect to CDNs -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://unpkg.com">

<!-- Google Analytics - only loaded after consent -->
<script>
  function loadGA() {
    if (document.getElementById('ga-script')) return;
    var s = document.createElement('script');
    s.id = 'ga-script';
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Z8Y8NVRJ5Q';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-Z8Y8NVRJ5Q');
  }
  if (localStorage.getItem('cookie-consent') === 'accepted') {
    loadGA();
  }
</script>
{{ super() }}
{% endblock %}

{% block styles %}
<!-- Preload critical resources -->
<link rel="preload" href="{{ 'assets/css/bootstrap.min.css'|url }}" as="style">
<link rel="preload" href="https://fonts.googleapis.com/css?family=Fira+Mono:400,700&display=optional" as="style">

<!-- Critical CSS -->
<link rel="stylesheet" href="{{ 'assets/css/bootstrap.min.css'|url }}">
<link rel="stylesheet" href="{{ 'assets/css/root.min.css'|url }}">
<link rel="stylesheet" href="{{ 'assets/css/main.min.css'|url }}">
<link rel="stylesheet" href="{{ 'assets/css/media.min.css'|url }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira+Mono:400,700&display=optional">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">

<!-- Non-critical CSS (async) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="{{ 'assets/css/mkdocstrings.min.css'|url }}" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ 'assets/css/mkdocstrings.min.css'|url }}">
</noscript>

{%- for path in extra_css %}
<link href="{{ path }}" rel="stylesheet">
{%- endfor %}

{% if config.theme.theme_style %}
    {% if config.theme.theme_style == 'dark' %}
    <style>
        :root {
            --text: white;
            --title: white;
            --primary: white;
            --background: black;
        }
    </style>
    {% endif %}
{% endif %}
{% endblock %}
