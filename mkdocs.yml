site_name: "[alunjam.es ~]$"
site_url: https://alunjam.es
site_description: This is my personal site where I share my thoughts, guides, projects, and discoveries
site_author: Alun
copyright: Copyright &copy; 2026 Alun James
repo_url: https://github.com/aloonj/
repo_name: aloonj

theme:
  name: simple-blog
  custom_dir: overrides
  highlightjs: true
  theme_style: dark
  sidebar: true
  navigation_depth: 3
  site_name_style: fw-bold
  components:
    title: false
    home_title: false
    page_title: false
    site_name: true
    footer: true

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/mobile-menu.js

nav:
  - /home: index.md
  - /home/alunj:
    - Blog:
      - gcp/first-adventures-in-gcp.md
      - llm/running-llms-locally-with-vllm.md
      - cloudstack/nested-cloudstack-ansible.md
      - broadband/sky-fttp-opnsense.md
      - mobile-tablets/lenovo-tab-p11-lineageos-install.md
      - mobile-tablets/lenovo-tab-p11-stock-recovery.md
    - Portfolio: portfolio.md
  - /usr/share/docs: docs-index.md

plugins:
  - search
  - blogging:
      dirs:
        - broadband
        - llm
        - gcp
        - cloudstack
        - mobile-tablets
      features:
        tags:
          index_page: false
          insert: false
      time_format: '%d %B %Y'
      paging: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - admonition
  - md_in_html

# Set the directory for the built site
site_dir: site
